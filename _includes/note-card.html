<a class="note" href="{{ include.post.url | relative_url }}">
  <span class="note-date"><span class="paper-only">{{ include.post.date | date: "%b %-d, %Y" }}</span><span class="terminal-only">{{ include.post.date | date: "%Y-%m-%d" }}</span></span>
  <div class="note-body">
    <h3 class="note-title">{{ include.post.title }}</h3>
    <p class="note-excerpt">{{ include.post.excerpt | strip_html | normalize_whitespace | truncate: 160 }}</p>
    <span class="note-more">Read the note &rarr;</span>
  </div>
</a>
