---
layout: blank
---
      <article class="post">
        <div class="post-head">
          <a class="back-link" href="{{ "/" | relative_url }}">&larr; All notes</a>
          <h1 class="post-title">{{ page.title }}</h1>
          {% if page.date %}
          <div class="post-meta">
            <span>{{ page.date | date: "%b %-d, %Y" }}</span>
            {% if page.author %}<span>&middot;</span><span>{{ page.author }}</span>{% endif %}
            {% for tag in page.tags %}<span class="note-tag tag-a">{{ tag | downcase }}</span>{% endfor %}
          </div>
          {% endif %}
        </div>
        <div class="post-body">
          {{ content }}
        </div>
        {% include share-page.html %}
        <div class="post-extras">
          {% include donate.html %}
        </div>
      </article>
